name: Design System CI & Storybook Publish

on:
  push:
    branches: [main, feature/setup]
    paths:
      - 'apps/public_crm_portal_designsystem_v1/**'
      - '.github/workflows/designsystem.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/public_crm_portal_designsystem_v1/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/public_crm_portal_designsystem_v1

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: apps/public_crm_portal_designsystem_v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook --if-present

      - name: Run tests
        run: npm test --if-present

  publish-storybook:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/public_crm_portal_designsystem_v1

    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: apps/public_crm_portal_designsystem_v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook --if-present

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/public_crm_portal_designsystem_v1/storybook-static
          destination_dir: storybook/public_crm_portal_designsystem_v1
